##### Prefix #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g base-index 1

set -g extended-keys on
set -g extended-keys-format csi-u

##### Reload config #####
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### Modes #####
setw -g mode-keys vi

##### Mouse #####
set -g mouse on

##### Terminal #####
set -g default-terminal "screen-256color"

##### Basic binds #####
bind : command-prompt
bind r refresh-client
bind L clear-history

bind Space next-window
bind BSpace previous-window
bind Enter next-layout

##### Splits & navigation #####
bind v split-window -h
bind s split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Smart vim-aware pane switching #####
bind -n C-h if-shell -F '#{==:#{pane_current_command},vim}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F '#{==:#{pane_current_command},vim}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell -F '#{==:#{pane_current_command},vim}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell -F '#{==:#{pane_current_command},vim}' 'send-keys C-l' 'select-pane -R'
bind -n C-\\ if-shell -F '#{==:#{pane_current_command},vim}' 'send-keys C-\\' 'select-pane -l'

bind C-l send-keys C-l

##### Layout #####
bind C-o rotate-window

bind + select-layout main-horizontal
bind = select-layout main-vertical

setw -g other-pane-height 25
setw -g other-pane-width 80

##### Window / pane #####
bind a last-pane
bind q display-panes
bind c new-window
bind t next-window
bind T previous-window

##### Copy mode #####
bind [ copy-mode
bind ] paste-buffer

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

##### Display #####
setw -g display-panes-time 1500

##### Status bar #####
set -g status-interval 1
set -g status-left ""
set -g status-right "%l:%M%p"

set -g status-style fg=default
set -g window-status-current-style fg=magenta

##### Colors (modern style syntax) #####
set -g status-style bg=black
set -g pane-border-style fg=black
set -g pane-active-border-style fg=black

if-shell '[ "$COLORFGBG" = "11;15" ]' {
    set -g status-style bg=white
    set -g pane-border-style fg=white
    set -g pane-active-border-style fg=white
}

##### Activity #####
setw -g monitor-activity on
set -g visual-activity on

##### macOS clipboard (optional, usually no longer needed) #####
# set -g default-command "reattach-to-user-namespace -l $SHELL"

##### Repeat #####
set -g repeat-time 0

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended

set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark'

##### Themes & local config #####
if-shell '[ -f ~/.tmux.conf.local ]' {
    source-file ~/.tmux.conf.local
}

##### TPM init #####
run-shell '~/.tmux/plugins/tpm/tpm'
